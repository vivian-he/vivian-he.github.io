<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base for you · Personalized discovery</title><link rel="stylesheet" href="../go-base-oct/style.css"><style>.intro button{display:block;width:100%;margin:10px 0;padding:12px 16px;border:1px solid #ddd;border-radius:14px;background:#fff;text-align:left;color:#191919;font:700 15px system-ui;cursor:pointer}.intro .eyebrow{color:#606060}.phone{border:0;border-radius:36px;box-shadow:none;background:transparent}</style></head><body><main><section class="intro"><p class="eyebrow">BASE-FOR-YOU</p><h1>Your next favorite.</h1><p>Home → In-Store Rewards → suggestions for you.</p><nav aria-label="Prototype controls"><button data-stage="home">Replay from Home</button><a href="../base-after/">Open the separate review flow →</a></nav></section><div class="phone" aria-label="Interactive review prototype"><iframe id="after-frame" title="Home to personalized dining" src="../base-after/dist/?flow=for-you"></iframe></div></main><script>const phone=document.querySelector('.phone'),frame=document.querySelector('iframe');new ResizeObserver(()=>{const s=phone.clientWidth/393;frame.style.height=`${phone.clientHeight/s}px`;frame.style.transform=`scale(${s})`}).observe(phone);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>frame.contentWindow.postMessage({type:'base-after:reset',stage:b.dataset.stage},location.origin));</script></body></html>
