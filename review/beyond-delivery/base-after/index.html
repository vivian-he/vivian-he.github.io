<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base after · Review flow</title><link rel="stylesheet" href="../go-base-oct/style.css"><style>.intro button{display:block;width:100%;margin:10px 0;padding:12px 16px;border:1px solid #ddd;border-radius:14px;background:#fff;text-align:left;color:#191919;font:700 15px system-ui;cursor:pointer}.intro .eyebrow{color:#606060}.phone{border:0;border-radius:36px;box-shadow:none;background:transparent}</style></head><body><main><section class="intro"><p class="eyebrow">BASE-AFTER</p><h1>After the visit.</h1><p>Notification → DoorDash → GO → review → thank-you.</p><nav aria-label="Prototype controls"><button data-stage="notification">Replay from notification</button><button data-stage="prompt">Open review prompt</button><a href="../base-for-you/">Open the separate For you flow →</a></nav></section><div class="phone" aria-label="Interactive review prototype"><iframe id="after-frame" title="Review and personalized dining" src="./dist/"></iframe></div></main><script>const phone=document.querySelector('.phone'),frame=document.querySelector('iframe');new ResizeObserver(()=>{const s=phone.clientWidth/393;frame.style.height=`${phone.clientHeight/s}px`;frame.style.transform=`scale(${s})`}).observe(phone);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>frame.contentWindow.postMessage({type:'base-after:reset',stage:b.dataset.stage},location.origin));</script></body></html>
