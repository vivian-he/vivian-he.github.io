<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio · Asset desk</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font:14px Arial,sans-serif}header{padding:36px 5% 24px;background:white;border-bottom:1px solid #eee}h1{font-size:30px;letter-spacing:-1px;margin:0 0 12px}p{color:#777;line-height:1.6}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px}button,a.action{font:inherit;cursor:pointer;border:1px solid #ddd;border-radius:20px;background:#fff;color:#444;padding:10px 15px;text-decoration:none}button[aria-pressed=true]{background:#242424;color:#fff}a{color:#4a665c}main{padding:28px 5%}h2{font-size:19px;font-weight:500}.section{margin:30px 0 14px;color:#888;font-size:11px;letter-spacing:1px;text-transform:uppercase}.row{background:white;border:1px solid #e7e7e7;border-radius:12px;padding:20px;margin:10px 0;display:grid;grid-template-columns:45px 1.1fr 1fr;gap:16px}.number{color:#999;font-size:22px}.title{font-size:17px;line-height:1.4;margin-bottom:10px}.visual{color:#777;margin:7px 0;font-size:13px}.note{font-size:12px;color:#999;line-height:1.6}textarea,input,select{font:inherit;border:1px solid #ddd;border-radius:7px;padding:10px;width:100%;margin-top:8px;background:#fff}textarea{height:66px;resize:vertical}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.asset{background:white;padding:15px;border-radius:12px;border:1px solid #eee}.asset img{width:100%;height:220px;object-fit:contain;background:#fafafa}.asset h3{font-size:14px}.asset p{font-size:12px}.saved{font-size:11px;color:#79897e}.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px}.summary{padding:18px 0;color:#777}.tip{border-left:3px solid #bdcdc4;padding-left:14px}button:focus-visible,a:focus-visible{outline:3px solid #76968a;outline-offset:3px}@media(max-width:800px){.row{grid-template-columns:30px 1fr}.choices{grid-column:2}.gallery{grid-template-columns:1fr 1fr}}@media(max-width:500px){.gallery{grid-template-columns:1fr}}
.candidate{padding:14px 0;border-top:1px solid #eee;margin-top:14px}.candidate a{font-size:13px}.candidate button{font-size:11px;padding:6px 10px;margin-top:7px}</style></head><body><header><h1>Tomorrow starts here.</h1><p>Two decks, one asset checklist. Choose a source for each slide; separate original work from reference implementations.</p><nav><a class="action" href="../deck-assets/index.html">In-deck asset bank ↗</a><button data-project="0">Affordable Meals</button><button data-project="1">DoorDash, in person</button><button data-project="gallery">Visuals already saved</button><button id="export">Export my selections ↓</button></nav><div class="links"><a href="../../research/asset-run/affordable.md">Affordable Meals findings</a><a href="../../research/asset-run/going-out.md">Going Out findings</a><a href="../../research/overnight-evidence/ledger.md">Evidence ledger</a><a href="../affordable-story/index.html">Affordable deck ↗</a><a href="../beyond-delivery/index.html">In-person deck ↗</a></div></header><main id="content"></main><script src="data.js"></script><script src="candidates.js"></script><script>
let view=0,selected={};try{selected=JSON.parse(localStorage.getItem('portfolio-asset-selections')||'{}')}catch{}const $=s=>document.querySelector(s),escape=s=>String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function sourceList(project,slide){return (CANDIDATES[project]||[]).filter(x=>(x.slides||[]).includes(slide)).map((x,i)=>`<div class="candidate"><a href="${escape(x.url)}" target="_blank">${escape(x.title)} ↗</a><div class="note">${escape(x.ownership)} · ${escape(x.freshness||x.status)}</div><div class="note">${escape(x.notes)}</div><button data-source="${escape(x.url)}" data-owner="${escape(x.ownership)}">Use this source</button></div>`).join('')}
function draw(){document.querySelectorAll('[data-project]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.project===String(view)));if(view==='gallery'){$('#content').innerHTML='<p class="tip">These are verified local files, not necessarily the newest design. Full-slide captures are references—not finished presentation crops.</p><div class="gallery">'+ASSETS.gallery.map(x=>`<article class="asset"><a href="${x.path}" target="_blank"><img src="${x.path}" alt="${escape(x.label)}" loading="lazy"></a><h3>${escape(x.label)}</h3><p>${escape(x.source)}</p><a href="${x.path}" target="_blank">Open original ↗</a></article>`).join('')+'</div>';return}const p=ASSETS.projects[view];let section='';$('#content').innerHTML='<div class="summary">Select actual screens first. Static images are enough unless motion explains a decision. Your selections are saved in this browser; export them to carry them elsewhere.</div>'+p.slides.map(s=>{const key=p.slug+'-'+s.number,val=selected[key]||{};let heading=s.section!==section?'<div class="section">'+escape(s.section)+'</div>':'';section=s.section;return heading+`<article class="row"><div class="number">${String(s.number).padStart(2,'0')}</div><div><div class="title">${escape(s.title)}</div>${s.visuals.length?s.visuals.map(v=>`<div class="visual">${escape(v.kind)} · ${escape(v.label)}</div>`).join(''):'<div class="visual">Section divider · no asset needed</div>'}<p class="note">${escape(s.note)}</p><a href="../${p.slug}/index.html#${s.number}" target="_blank">Open slide ↗</a></div><div class="choices" data-key="${key}"><label>Selected asset / Figma / prototype URL<input data-field="url" value="${escape(val.url)}" placeholder="Paste the chosen source"></label><select data-field="status" aria-label="Asset status"><option>Needs selection</option><option>Original work selected</option><option>Reference implementation only</option><option>Needs screenshot / recording</option><option>No asset needed</option></select><textarea data-field="note" aria-label="Selection notes" placeholder="Exact frame, state, version, or remaining question">${escape(val.note)}</textarea><span class="saved"></span>${sourceList(p.slug,s.number)}</div></article>`}).join('');document.querySelectorAll('.choices').forEach(el=>{const key=el.dataset.key;el.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{const field=el.querySelector('[data-field=url]');field.value=b.dataset.source;field.dispatchEvent(new Event('input'));const status=el.querySelector('select');status.value=/Nate|reference|baseline|Penny/i.test(b.dataset.owner)?'Reference implementation only':'Needs screenshot / recording';status.dispatchEvent(new Event('input'))});el.querySelector('select').value=selected[key]?.status||'Needs selection';el.querySelectorAll('[data-field]').forEach(input=>input.oninput=()=>{selected[key]={...(selected[key]||{}),[input.dataset.field]:input.value};try{localStorage.setItem('portfolio-asset-selections',JSON.stringify(selected));el.querySelector('.saved').textContent='Saved in this browser'}catch{el.querySelector('.saved').textContent='Browser storage unavailable — export to save'}})})}
document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{view=b.dataset.project==='gallery'?'gallery':Number(b.dataset.project);draw()});$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(selected,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='portfolio-asset-selections.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};draw();</script></body></html>
