<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rewards education · native still</title><style>html,body{margin:0;width:393px;height:852px;overflow:hidden;background:#fff}iframe{border:0;width:393px;height:852px;visibility:hidden}</style></head><body><iframe id="screen" title="Native rewards education experiment"></iframe><script type="module">
import {RewardsMapPlayer,REWARDS_SOURCE} from '/review/portfolio-previews/in-store-rewards/map-comparison/scene-player.js';

const player=new RewardsMapPlayer(frame,{onReady:async()=>{try{const doc=frame.contentDocument,style=doc.createElement('style');style.textContent='*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.latest-native-status>div:nth-child(2){visibility:hidden!important}.deck-autoplay-touch,.go-user-pulse,.maplibregl-user-location-dot:before{display:none!important}.home-indicator,.home-bar{display:none!important}';doc.head.append(style);await until(()=>doc.querySelectorAll('.go-pin').length>4);if(state==='guided'){doc.defaultView.dispatchEvent(new doc.defaultView.Event('go-show-guided-onboarding-percent-back'));const cta=await until(()=>doc.querySelector('.go-guided-sheet__cta'));cta.click();await until(()=>[...doc.querySelectorAll('.go-guided-sheet__panel')].some(e=>e.getAttribute('aria-hidden')==='false'&&e.textContent.includes('Step 1')))}else{const collarStyle=doc.createElement('style');collarStyle.textContent='.go-collar{position:relative!important;inset:auto!important;height:40px!important;min-height:40px!important;width:100%!important;margin:0 0 8px!important;border-radius:12px 12px 0 0!important;z-index:2!important}';doc.head.append(collarStyle);doc.defaultView.dispatchEvent(new doc.defaultView.Event('oct-hub-enter'));await until(()=>doc.querySelector('.pedregal-snap-sheet[data-snap="open"]'))}await doc.fonts.ready;player.pause();frame.style.visibility='visible';document.documentElement.dataset.ready='true'}catch(error){document.documentElement.dataset.error=error.message;frame.style.visibility='visible'}}});frame.addEventListener('load',()=>player.attach());frame.src=REWARDS_SOURCE+'&c=first-visit&assets=store-polish-3&education=native-1';
