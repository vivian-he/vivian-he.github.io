<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520"><rect width="640" height="520" fill="#f6f7f9"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="45" fill="#a16d5c" font-size="12" letter-spacing="2">FROM QUALITY SIGNALS TO ACTION</text><rect x="32" y="88" width="576" height="108" rx="12" fill="white" stroke="#dde1e6"/><text x="52" y="120" font-size="13" fill="#e23b2d">01</text><text x="98" y="121" font-size="20" font-weight="700" fill="#252a30">See what customers received</text><text x="98" y="151" font-size="14" fill="#777e87">Reviews and meal photos reveal where the promise falls short.</text><path d="M320 199v18m-5-5 5 5 5-5" fill="none" stroke="#bdc3ca"/><rect x="32" y="222" width="576" height="108" rx="12" fill="white" stroke="#dde1e6"/><text x="52" y="254" font-size="13" fill="#e23b2d">02</text><text x="98" y="255" font-size="20" font-weight="700" fill="#252a30">Give merchants a practical next step</text><text x="98" y="285" font-size="14" fill="#777e87">Partners need clear guidance they can trust and act on.</text><path d="M320 333v18m-5-5 5 5 5-5" fill="none" stroke="#bdc3ca"/><rect x="32" y="356" width="576" height="108" rx="12" fill="white" stroke="#dde1e6"/><text x="52" y="388" font-size="13" fill="#e23b2d">03</text><text x="98" y="389" font-size="20" font-weight="700" fill="#252a30">Keep people available for follow-up</text><text x="98" y="419" font-size="14" fill="#777e87">Routine reporting scales; targeted support stays personal.</text></g></svg>