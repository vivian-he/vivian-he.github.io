<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-label="Quality promise, limits of tasting and merchant follow-up, and need for broader feedback"><rect width="640" height="520" fill="#F7F7F6"/><text x="32" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#E23B2D" text-anchor="start">QUALITY PROMISE</text><text x="32" y="81" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1E1E1E" text-anchor="start">The meal must hold up at the table</text><rect x="32" y="109" width="176" height="68" rx="12" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1"/><circle cx="57" cy="143" r="5" fill="#E23B2D"/><text x="75" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E1E1E" text-anchor="start">Filling</text><rect x="232" y="109" width="176" height="68" rx="12" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1"/><circle cx="257" cy="143" r="5" fill="#E23B2D"/><text x="275" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E1E1E" text-anchor="start">Balanced</text><rect x="432" y="109" width="176" height="68" rx="12" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1"/><circle cx="457" cy="143" r="5" fill="#E23B2D"/><text x="475" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E1E1E" text-anchor="start">Enjoyable</text><line x1="320" y1="191" x2="320" y2="221" stroke="#E23B2D" stroke-width="2" stroke-linecap="round"/><path d="M314 216 L320 221 L314 226" fill="none" stroke="#E23B2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#676767" text-anchor="start">LIMITED HUMAN CAPACITY</text><rect x="32" y="268" width="278" height="93" rx="16" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1"/><rect x="330" y="268" width="278" height="93" rx="16" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1"/><text x="52" y="303" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E1E1E" text-anchor="start">Taste testing</text><text x="52" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#676767" text-anchor="start">Only a portion of meals</text><text x="350" y="303" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E1E1E" text-anchor="start">Merchant follow-up</text><text x="350" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#676767" text-anchor="start">Individual conversations</text><line x1="170" y1="362" x2="170" y2="392" stroke="#D8D8D8" stroke-width="2" stroke-linecap="round"/><line x1="470" y1="362" x2="470" y2="392" stroke="#D8D8D8" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="392" x2="470" y2="392" stroke="#D8D8D8" stroke-width="2" stroke-linecap="round"/><line x1="320" y1="392" x2="320" y2="415" stroke="#E23B2D" stroke-width="2" stroke-linecap="round"/><path d="M314 410 L320 415 L314 420" fill="none" stroke="#E23B2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="425" width="576" height="66" rx="14" fill="#FFF2F0" stroke="#F0B9B3" stroke-width="1"/><text x="320" y="452" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">Need broader feedback and targeted human review</text><text x="320" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#676767" text-anchor="middle">as the program grows</text></svg>