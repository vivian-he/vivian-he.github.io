<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared device surface · Deck Template</title>
  <link rel="stylesheet" href="device-surface.css?v=20261023">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #202124; font: 16px/1.4 Arial, sans-serif; }
    main { min-height: 100svh; padding: clamp(24px, 5vw, 72px); }
    h1 { max-width: 1100px; margin: 0 auto 10px; font-size: clamp(25px, 3vw, 38px); letter-spacing: -.04em; }
    p { max-width: 1100px; margin: 0 auto; color: #686b70; }
    .pair { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: clamp(36px, 7vw, 110px); margin: 48px auto 0; }
    .sample { width: min(30vw, 220px); min-width: 160px; aspect-ratio: 393 / 852; display: grid; place-items: center; text-align: center; }
    .sample span { color: #777; font-size: 13px; }
  </style>
</head>
<body>
  <main class="deck-device-canvas">
    <h1>Shared phone surface</h1>
    <p>Reference canvas, edge, metallic rim, and cast shadow. Decks supply their own screens and placement.</p>
    <div class="pair" aria-label="Device frames at three sizes">
      <div class="sample deck-device-surface" style="width:160px;min-width:0"><span>Small</span></div>
      <div class="sample deck-device-surface" style="width:220px"><span>Medium</span></div>
      <div class="sample deck-device-surface" style="width:254px"><span>Reference</span></div>
    </div>
  </main>
</body>
</html>
